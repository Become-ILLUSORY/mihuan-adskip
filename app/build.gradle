apply plugin: 'com.android.application'

// Signing material is injected from GitHub Actions repository secrets.
def ksFile = System.getenv("KEYSTORE_FILE")
def ksPass = System.getenv("KEYSTORE_PASSWORD")
def ksAlias = System.getenv("KEY_ALIAS")
def ksKeyPass = System.getenv("KEY_PASSWORD")
def hasSigning = ksFile != null && !ksFile.isEmpty() && new File(ksFile).exists()

android {
    namespace 'com.becomeillusory.adskip'
    compileSdk 34

    defaultConfig {
        applicationId 'com.becomeillusory.adskip'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // debug build keeps the default debug keystore (auto-signed)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Provided at runtime by LSPosed. Bundled as a local file so CI does not depend on a flaky repo.
    compileOnly files('libs/api-82.jar')
}
